<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <h1>Student Portal</h1>
    </header>

    <main class="container">
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Search" />
            <button id="searchBtn">Search</button>
        </div>

        <div class="button-group">
            <button id="sortAZ">Sort A&rarr;Z</button>
            <button id="sortZA">Sort Z&rarr;A</button>
            <button id="sortMarks">Sort By Marks</button>
            <button id="sortPassing">Sort By Passing</button>
            <button id="sortClass">Sort By Class</button>
            <button id="sortGender">Sort By Gender</button>
        </div>

        <div id="tablesContainer"></div>
    </main>
    <script src="script.js"></script>
    <script src="data.js"></script>
</body>
</html>
